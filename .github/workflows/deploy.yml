name: Validate and deploy twvita site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: twvita-site-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate
        run: npm run validate

  deploy-production:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    concurrency:
      group: twvita-pages-production-twvita-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Record deployment source and target
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'Source ref: %s\nSource SHA: %s\nTarget: project twvita, branch main\n' "$SOURCE_REF" "$SOURCE_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy to Cloudflare Pages
        run: |
          node --version
          npx --no-install wrangler --version
          npx --no-install wrangler pages deploy public --project-name=twvita --branch=main
